<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tornada 3D — WebAssembly</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin: 12px 0 4px;
            font-size: 1.4rem;
            color: #7ec8e3;
        }
        #info {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        #canvas-container {
            position: relative;
            border: 2px solid #333;
            border-radius: 6px;
            overflow: hidden;
        }
        canvas.emscripten {
            display: block;
            background: #000;
        }
        #spinner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        #spinner .loader {
            width: 48px; height: 48px;
            border: 5px solid #333;
            border-top-color: #7ec8e3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #spinner.hidden { display: none; }
        #status {
            font-size: 0.8rem;
            color: #888;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <h1>Tornada 3D</h1>
    <p id="info">Muta mouse-ul pentru a controla tornada | WASD = misca camera | Click dreapta + drag = roteste camera</p>

    <div id="canvas-container">
        <canvas class="emscripten" id="canvas" width="1280" height="720"
                oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div id="spinner">
            <div class="loader"></div>
            <div>Se incarca...</div>
        </div>
    </div>

    <div id="status"></div>

    <script>
        var statusElement = document.getElementById('status');
        var spinnerElement = document.getElementById('spinner');

        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })(),
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); },
            setStatus: function(text) {
                statusElement.textContent = text;
                if (text === '' || text.includes('Running')) {
                    spinnerElement.classList.add('hidden');
                }
            },
            onRuntimeInitialized: function() {
                spinnerElement.classList.add('hidden');
                statusElement.textContent = 'Rulare...';
            },
            monitorRunDependencies: function(left) {
                if (left === 0) {
                    statusElement.textContent = 'Pregatire...';
                } else {
                    statusElement.textContent = 'Se incarca dependentele (' + left + ')...';
                }
            }
        };

        Module.setStatus('Se descarca...');
        window.onerror = function() {
            Module.setStatus('Eroare la initializare!');
            spinnerElement.classList.add('hidden');
        };
    </script>

    {{{ SCRIPT }}}
</body>
</html>
