<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Tornada 3D — controleaza o tornada, distruge case si copaci, supravietuieste 10 valuri. Joc C++ / WebAssembly / WebGL2, direct in browser.">
    <meta property="og:title" content="Tornada 3D">
    <meta property="og:description" content="Controleaza o tornada, distruge tot si supravietuieste 10 valuri. Direct in browser.">
    <meta property="og:type" content="website">
    <title>Tornada 3D — WebAssembly</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%; height: 100%;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin: 6px 0 2px;
            font-size: clamp(0.9rem, 2.5vw, 1.4rem);
            color: #7ec8e3;
        }
        #info {
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            color: #aaa;
            margin-bottom: 2px;
            text-align: center;
            padding: 0 8px;
        }
        #controls {
            display: flex;
            gap: 6px;
            margin-bottom: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            background: rgba(126,200,227,0.10);
            border: 1px solid rgba(126,200,227,0.35);
            color: #7ec8e3;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: inherit;
            transition: background 0.15s;
            -webkit-user-select: none;
            user-select: none;
        }
        .ctrl-btn:hover { background: rgba(126,200,227,0.25); }
        .ctrl-btn.active { background: rgba(255,100,100,0.18); border-color: rgba(255,100,100,0.45); color: #f88; }
        #menu-toggle {
            display: none;
            position: absolute;
            top: 8px; right: 8px;
            z-index: 20;
            background: rgba(20,25,40,0.7);
            border: 1px solid rgba(126,200,227,0.4);
            color: #7ec8e3;
            width: 38px; height: 38px;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        @media (hover: none) and (pointer: coarse) {
            #controls { display: none; }
            #controls.show { display: flex; }
            #menu-toggle { display: block; }
        }
        #canvas-container {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: 1920px;
            border: 2px solid #333;
            border-radius: 6px;
            overflow: hidden;
        }
        canvas.emscripten {
            display: block;
            width: 100% !important;
            height: 100% !important;
            background: #000;
        }
        #spinner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }
        #spinner .loader {
            width: 48px; height: 48px;
            border: 5px solid #333;
            border-top-color: #7ec8e3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #spinner.hidden { display: none; }
        #status {
            font-size: 0.7rem;
            color: #888;
            padding: 2px 0;
        }

        /* Mobile touch controls overlay */
        .touch-zone {
            display: none;
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 40%;
            z-index: 5;
            pointer-events: auto;
        }
        .touch-zone-left { left: 0; }
        .touch-zone-right { right: 0; }
        .touch-indicator {
            position: absolute;
            border: 2px solid rgba(126,200,227,0.5);
            border-radius: 50%;
            pointer-events: none;
            display: none;
        }
        #joystick-base {
            width: 100px; height: 100px;
            bottom: 30px; left: 30px;
        }
        #joystick-knob {
            width: 44px; height: 44px;
            background: rgba(126,200,227,0.35);
            bottom: 58px; left: 58px;
        }
        #look-indicator {
            width: 60px; height: 60px;
            border-color: rgba(255,200,100,0.4);
            background: rgba(255,200,100,0.15);
        }
        .mobile-hint {
            display: none;
            position: absolute;
            bottom: 8px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.4);
            pointer-events: none;
            z-index: 6;
        }
        #hint-left { left: 12px; }
        #hint-right { right: 12px; }

        @media (hover: none) and (pointer: coarse) {
            .touch-zone { display: block; }
            .mobile-hint { display: block; }
            #joystick-base { display: block; }
            #info { display: none; }
        }
        #scores-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #scores-modal.hidden { display: none; }
        #scores-box {
            background: #1a1a2e;
            border: 1px solid #7ec8e3;
            border-radius: 10px;
            padding: 20px 28px;
            min-width: 280px;
            max-width: 440px;
            width: 90%;
        }
        #scores-box h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        #scores-box h3 {
            color: #7ec8e3;
            font-size: 0.85rem;
            margin: 10px 0 4px;
        }
        #scores-list, #scores-global {
            list-style: none;
            font-size: 0.85rem;
            line-height: 1.8;
            color: #ddd;
        }
        #name-row {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        #player-name {
            background: #10101f;
            border: 1px solid rgba(126,200,227,0.35);
            border-radius: 4px;
            color: #eee;
            padding: 3px 8px;
            width: 140px;
            font-size: 0.8rem;
            font-family: inherit;
        }
        #scores-close {
            display: block;
            margin: 14px auto 0;
            padding: 6px 22px;
            background: #7ec8e3;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>Tornada 3D</h1>
    <p id="info">Mouse = tornado | WASD = camera | Click dreapta + drag = roteste</p>

    <div id="controls">
        <button class="ctrl-btn" id="btn-fullscreen">⛶ Fullscreen (F)</button>
        <button class="ctrl-btn" id="btn-pause">⏸ Pauza (P)</button>
        <button class="ctrl-btn" id="btn-mute">🔊 Sunet (M)</button>
        <button class="ctrl-btn" id="btn-quality">⚙ Calitate: Ridicat</button>
        <button class="ctrl-btn" id="btn-restart">↺ Restart (R)</button>
        <button class="ctrl-btn" id="btn-timeattack">⏱ Time Attack</button>
        <button class="ctrl-btn" id="btn-scores">🏆 Scoruri</button>
    </div>

    <div id="canvas-container">
        <button id="menu-toggle" aria-label="Meniu">&#9776;</button>
        <canvas class="emscripten" id="canvas"
                oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div id="spinner">
            <div class="loader"></div>
            <div>Se incarca...</div>
        </div>

        <!-- Mobile touch zones -->
        <div class="touch-zone touch-zone-left" id="zone-left"></div>
        <div class="touch-zone touch-zone-right" id="zone-right"></div>
        <div class="touch-indicator" id="joystick-base"></div>
        <div class="touch-indicator" id="joystick-knob"></div>
        <div class="touch-indicator" id="look-indicator"></div>
        <span class="mobile-hint" id="hint-left">&#x2B05; MOVE</span>
        <span class="mobile-hint" id="hint-right">LOOK &#x27A1;</span>
    </div>

    <div id="status"></div>

    <script>
        var statusElement = document.getElementById('status');
        var spinnerElement = document.getElementById('spinner');

        // Stamped by deploy_vps.sh; busts the long-lived immutable cache on
        // tornado.wasm / tornado.data when a new build is deployed.
        var TORNADO_BUILD = '';

        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })(),
            locateFile: function(path) {
                return TORNADO_BUILD ? path + '?v=' + TORNADO_BUILD : path;
            },
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); },
            setStatus: function(text) {
                statusElement.textContent = text;
                if (text === '' || text.includes('Running')) {
                    spinnerElement.classList.add('hidden');
                }
            },
            onRuntimeInitialized: function() {
                spinnerElement.classList.add('hidden');
                statusElement.textContent = 'Rulare...';
                initTouchControls();
                // Restore saved settings; default to Medium quality on mobile
                var saved = {};
                try { saved = JSON.parse(localStorage.getItem('tornado3d_settings') || '{}'); } catch(e) {}
                var isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                var q = (typeof saved.quality === 'number' && saved.quality >= 0 && saved.quality <= 2)
                        ? saved.quality : (isMobile ? 1 : 2);
                qualityLevel = q;
                document.getElementById('btn-quality').textContent = qualityLabels[q];
                if (Module._set_quality) Module._set_quality(q);
                if (saved.muted) document.getElementById('btn-mute').click();
            },
            monitorRunDependencies: function(left) {
                if (left === 0) {
                    statusElement.textContent = 'Pregatire...';
                } else {
                    statusElement.textContent = 'Se incarca dependentele (' + left + ')...';
                }
            }
        };

        // ── Responsive canvas sizing ─────────────────────────────
        function resizeCanvas() {
            var container = document.getElementById('canvas-container');
            var canvas = document.getElementById('canvas');
            var dpr = window.devicePixelRatio || 1;
            var w = container.clientWidth;
            var h = container.clientHeight;
            // Set actual pixel resolution (capped for performance on mobile)
            var maxDim = ('ontouchstart' in window) ? 1280 : 1920;
            var scale = Math.min(1, maxDim / Math.max(w * dpr, 1));
            canvas.width  = Math.floor(w * dpr * scale);
            canvas.height = Math.floor(h * dpr * scale);
        }
        window.addEventListener('resize', resizeCanvas);
        // Initial size set after a tick so container has layout
        setTimeout(resizeCanvas, 0);

        // ── Touch controls ───────────────────────────────────────
        function initTouchControls() {
            var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (!isTouchDevice) return;

            var canvas = document.getElementById('canvas');
            var container = document.getElementById('canvas-container');
            var joyBase = document.getElementById('joystick-base');
            var joyKnob = document.getElementById('joystick-knob');
            var lookInd = document.getElementById('look-indicator');

            var moveTouch = null;  // touch ID for movement
            var lookTouch = null;  // touch ID for camera look
            var tornadoTouch = null; // touch ID for tornado control
            var moveOrigin = {x:0, y:0};
            var lookLast = {x:0, y:0};
            var joyRadius = 50;

            function getTouchXY(t) {
                var r = container.getBoundingClientRect();
                return {x: t.clientX - r.left, y: t.clientY - r.top};
            }

            function isLeftHalf(pos) {
                return pos.x < container.clientWidth * 0.5;
            }

            function updateTornadoCursor(pos) {
                var cw = container.clientWidth, ch = container.clientHeight;
                var nx =  (pos.x / cw) * 2.0 - 1.0;
                var ny = -((pos.y / ch) * 2.0 - 1.0);
                if (Module._touch_set_cursor) {
                    Module._touch_set_cursor(nx, ny);
                }
            }

            container.addEventListener('touchstart', function(e) {
                // Let taps on the menu button behave as normal clicks
                if (e.target && e.target.closest && e.target.closest('#menu-toggle')) return;
                e.preventDefault();
                for (var i = 0; i < e.changedTouches.length; i++) {
                    var t = e.changedTouches[i];
                    var pos = getTouchXY(t);

                    if (isLeftHalf(pos) && moveTouch === null) {
                        // Left side: virtual joystick
                        moveTouch = t.identifier;
                        moveOrigin = pos;
                        joyBase.style.left = (pos.x - joyRadius) + 'px';
                        joyBase.style.bottom = 'auto';
                        joyBase.style.top = (pos.y - joyRadius) + 'px';
                        joyBase.style.display = 'block';
                        joyKnob.style.left = (pos.x - 22) + 'px';
                        joyKnob.style.bottom = 'auto';
                        joyKnob.style.top = (pos.y - 22) + 'px';
                        joyKnob.style.display = 'block';
                    } else if (!isLeftHalf(pos) && lookTouch === null) {
                        // Right side: camera look
                        lookTouch = t.identifier;
                        lookLast = pos;
                        if (Module._touch_set_look) Module._touch_set_look(0, 0, 1);
                    }

                    // Any touch also steers tornado
                    if (tornadoTouch === null) {
                        tornadoTouch = t.identifier;
                        updateTornadoCursor(pos);
                    }
                }
            }, {passive: false});

            container.addEventListener('touchmove', function(e) {
                e.preventDefault();
                for (var i = 0; i < e.changedTouches.length; i++) {
                    var t = e.changedTouches[i];
                    var pos = getTouchXY(t);

                    if (t.identifier === moveTouch) {
                        var dx = pos.x - moveOrigin.x;
                        var dy = pos.y - moveOrigin.y;
                        var dist = Math.sqrt(dx*dx + dy*dy);
                        var clampDist = Math.min(dist, joyRadius);
                        var nx = (dist > 0) ? (dx / dist) * clampDist / joyRadius : 0;
                        var ny = (dist > 0) ? -(dy / dist) * clampDist / joyRadius : 0;
                        if (Module._touch_set_move) Module._touch_set_move(nx, ny);
                        joyKnob.style.left = (moveOrigin.x + nx * joyRadius - 22) + 'px';
                        joyKnob.style.top = (moveOrigin.y - ny * joyRadius - 22) + 'px';
                    }

                    if (t.identifier === lookTouch) {
                        var ldx = pos.x - lookLast.x;
                        var ldy = lookLast.y - pos.y;  // inverted Y
                        lookLast = pos;
                        if (Module._touch_set_look) Module._touch_set_look(ldx, ldy, 1);
                    }

                    if (t.identifier === tornadoTouch) {
                        updateTornadoCursor(pos);
                    }
                }
            }, {passive: false});

            function endTouch(e) {
                for (var i = 0; i < e.changedTouches.length; i++) {
                    var t = e.changedTouches[i];
                    if (t.identifier === moveTouch) {
                        moveTouch = null;
                        if (Module._touch_set_move) Module._touch_set_move(0, 0);
                        joyBase.style.display = 'none';
                        joyKnob.style.display = 'none';
                    }
                    if (t.identifier === lookTouch) {
                        lookTouch = null;
                        if (Module._touch_set_look) Module._touch_set_look(0, 0, 0);
                    }
                    if (t.identifier === tornadoTouch) {
                        tornadoTouch = null;
                    }
                }
            }

            container.addEventListener('touchend', endTouch, {passive: false});
            container.addEventListener('touchcancel', endTouch, {passive: false});
        }
    </script>

    <!-- Leaderboard modal — must appear before the scripts that reference scores-close -->
    <div id="scores-modal" class="hidden">
        <div id="scores-box">
            <h2>🏆 Top Scoruri</h2>
            <div id="name-row">
                <label>Nume: <input id="player-name" maxlength="16"
                       placeholder="ANONIM" autocomplete="off"></label>
            </div>
            <h3>🌍 Global</h3>
            <ul id="scores-global"></ul>
            <h3>💻 Local</h3>
            <ul id="scores-list"></ul>
            <button id="scores-close">Inchide</button>
        </div>
    </div>

    <script>
        // ── Persisted settings ───────────────────────────────────
        function saveSettings() {
            try {
                localStorage.setItem('tornado3d_settings',
                    JSON.stringify({quality: qualityLevel, muted: soundMuted}));
            } catch(e) {}
        }

        // ── Mobile menu toggle ───────────────────────────────────
        document.getElementById('menu-toggle').addEventListener('click', function() {
            document.getElementById('controls').classList.toggle('show');
            setTimeout(resizeCanvas, 0); // canvas container height changed
        });

        // ── UI control buttons ───────────────────────────────────
        document.getElementById('btn-fullscreen').addEventListener('click', function() {
            var el = document.getElementById('canvas-container');
            if (!document.fullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
            }
        });
        document.addEventListener('fullscreenchange', function() {
            document.getElementById('btn-fullscreen').textContent =
                document.fullscreenElement ? '⛶ Fereastra (F)' : '⛶ Fullscreen (F)';
        });

        var paused = false;
        document.getElementById('btn-pause').addEventListener('click', function() {
            paused = !paused;
            this.textContent = paused ? '▶ Continua (P)' : '⏸ Pauza (P)';
            this.classList.toggle('active', paused);
            if (Module._set_paused) Module._set_paused(paused ? 1 : 0);
        });

        var soundMuted = false;
        document.getElementById('btn-mute').addEventListener('click', function() {
            soundMuted = !soundMuted;
            this.textContent = soundMuted ? '🔇 Mut (M)' : '🔊 Sunet (M)';
            this.classList.toggle('active', soundMuted);
            if (Module._toggle_sound) Module._toggle_sound(soundMuted ? 1 : 0);
            if (window._tornadoAudio && window._tornadoAudio.windGain) {
                window._tornadoAudio.windGain.gain.value = soundMuted ? 0 : 0.15;
            }
            if (window._tornadoAudio && window._tornadoAudio.musicGain) {
                window._tornadoAudio.musicGain.gain.value = soundMuted ? 0 : 0.045;
            }
            saveSettings();
        });

        var qualityLevel = 2;
        var qualityLabels = ['⚙ Calitate: Scazut', '⚙ Calitate: Mediu', '⚙ Calitate: Ridicat'];
        document.getElementById('btn-quality').addEventListener('click', function() {
            qualityLevel = (qualityLevel + 1) % 3;
            this.textContent = qualityLabels[qualityLevel];
            if (Module._set_quality) Module._set_quality(qualityLevel);
            saveSettings();
        });

        document.getElementById('btn-restart').addEventListener('click', function() {
            if (Module._restart_game) {
                Module._restart_game();
                // If game was paused, unpause so it resumes
                if (paused) document.getElementById('btn-pause').click();
            }
        });

        document.getElementById('btn-timeattack').addEventListener('click', function() {
            if (Module._start_time_attack) {
                Module._start_time_attack();
                if (paused) document.getElementById('btn-pause').click();
                document.getElementById('controls').classList.remove('show');
            }
        });

        function fillScoreList(listEl, scores, formatFn) {
            listEl.textContent = '';
            if (!scores || scores.length === 0) {
                var li = document.createElement('li');
                li.textContent = 'Niciun scor.';
                listEl.appendChild(li);
                return;
            }
            scores.forEach(function(sc, i) {
                var li = document.createElement('li');
                li.textContent = formatFn(sc, i);
                listEl.appendChild(li);
            });
        }

        document.getElementById('btn-scores').addEventListener('click', function() {
            var modal = document.getElementById('scores-modal');
            // Player name (used for global submissions)
            var nameInput = document.getElementById('player-name');
            try { nameInput.value = localStorage.getItem('tornado3d_name') || ''; } catch(e) {}

            // Local scores
            var scores = [];
            try { scores = JSON.parse(localStorage.getItem('tornado3d_scores') || '[]'); } catch(e) {}
            fillScoreList(document.getElementById('scores-list'), scores, function(sc, i) {
                return '#' + (i+1) + ' — ' + sc.score + ' puncte · Val ' + sc.wave + ' · ' + (sc.date || '');
            });

            // Global scores
            var globalList = document.getElementById('scores-global');
            globalList.textContent = '';
            var loading = document.createElement('li');
            loading.textContent = 'Se incarca...';
            globalList.appendChild(loading);
            fetch('/api/scores').then(function(r) { return r.json(); }).then(function(gs) {
                fillScoreList(globalList, gs, function(sc, i) {
                    return '#' + (i+1) + ' — ' + sc.name + ': ' + sc.score +
                           ' puncte · Val ' + sc.wave + ' · ' + (sc.date || '');
                });
            }).catch(function() {
                globalList.textContent = '';
                var li = document.createElement('li');
                li.textContent = 'Indisponibil momentan.';
                globalList.appendChild(li);
            });

            modal.classList.remove('hidden');
        });

        // Persist the player name; keep it to the characters the API accepts
        document.getElementById('player-name').addEventListener('input', function() {
            var clean = this.value.replace(/[^A-Za-z0-9 _.-]/g, '').slice(0, 16);
            if (clean !== this.value) this.value = clean;
            try { localStorage.setItem('tornado3d_name', clean); } catch(e) {}
        });
        document.getElementById('scores-close').addEventListener('click', function() {
            document.getElementById('scores-modal').classList.add('hidden');
        });

        var lastRPress = 0;
        window.addEventListener('keydown', function(e) {
            if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT')) return;
            if (e.code === 'KeyF') document.getElementById('btn-fullscreen').click();
            // Only use Escape as pause when NOT exiting fullscreen
            if (e.code === 'KeyP' || (e.code === 'Escape' && !document.fullscreenElement))
                document.getElementById('btn-pause').click();
            if (e.code === 'KeyM') document.getElementById('btn-mute').click();
            if (e.code === 'KeyR') {
                // Instant restart on victory/game-over; mid-game requires a
                // double press so an accidental R doesn't wipe the run
                var phase = (Module && Module._get_game_phase) ? Module._get_game_phase() : 0;
                var now = Date.now();
                if (phase >= 2 || now - lastRPress < 1500) {
                    lastRPress = 0;
                    document.getElementById('btn-restart').click();
                } else {
                    lastRPress = now;
                    var st = document.getElementById('status');
                    if (st) {
                        st.textContent = 'Apasa R din nou pentru restart';
                        setTimeout(function() {
                            if (st.textContent === 'Apasa R din nou pentru restart') st.textContent = '';
                        }, 1600);
                    }
                }
            }
            if (e.code === 'KeyC') {
                var pts = (Module && Module._get_score_points) ? Module._get_score_points() : 0;
                var text = 'Tornada 3D - Scor: ' + pts + ' puncte';
                if (navigator.share) {
                    navigator.share({title: 'Tornada 3D', text: text}).catch(function(){});
                } else if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(function() {
                        var s = document.getElementById('status');
                        if (s) { var old = s.textContent; s.textContent = 'Scor copiat!'; setTimeout(function(){ s.textContent = old; }, 2000); }
                    });
                }
            }
        });

        // Resume AudioContext on first user interaction (browsers suspend it before a gesture)
        function resumeAudioCtx() {
            if (window._tornadoAudio && window._tornadoAudio.ctx &&
                    window._tornadoAudio.ctx.state === 'suspended') {
                window._tornadoAudio.ctx.resume();
            }
        }
        document.getElementById('canvas').addEventListener('click', resumeAudioCtx);
        document.getElementById('canvas').addEventListener('touchstart', resumeAudioCtx, {passive: true});

        Module.setStatus('Se descarca...');
        window.onerror = function(msg, src, line, col, err) {
            Module.setStatus('Eroare: ' + (err ? err.message : msg));
            spinnerElement.classList.add('hidden');
        };
    </script>
