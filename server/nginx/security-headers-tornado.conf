# Security headers for tornado.micutu.com
# Install: /etc/nginx/snippets/security-headers-tornado.conf
#
# Included in EVERY location of the vhost: nginx drops all inherited
# add_header directives as soon as a block declares one of its own (each
# location sets Cache-Control), so a single server-level include would
# leave .wasm/.js/.css responses without them.
#
# Content-Security-Policy
#  - no 'unsafe-inline': the page has no inline scripts or styles (the
#    <script type="application/json"> / ld+json blocks are data, which
#    script-src does not govern);
#  - 'wasm-unsafe-eval' permits WebAssembly compilation only, not JS eval();
#  - 'nonce-$request_id' is fresh per request; Cloudflare's bot detection
#    injects an inline script into HTML responses and tags it with the
#    nonce it finds here;
#  - static.cloudflareinsights.com / cloudflareinsights.com: the Web
#    Analytics beacon that Cloudflare injects.
# tools/dev_server.py parses this file, so local runs enforce the same policy.
add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options      "nosniff" always;
add_header X-Frame-Options             "DENY" always;
add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy  "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy          "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), gamepad=(self), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(self), serial=(), usb=(), xr-spatial-tracking=()" always;
add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'nonce-$request_id' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
