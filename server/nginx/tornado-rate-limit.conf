# Install: /etc/nginx/conf.d/tornado-rate-limit.conf (http context).
# Coarse flood guard for /api/ keyed on the real visitor address (realip).
# A game session makes a handful of calls; the leaderboard service applies
# stricter per-endpoint limits itself.
limit_req_zone $binary_remote_addr zone=tornado_api:10m rate=60r/m;
