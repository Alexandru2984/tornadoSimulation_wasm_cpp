# nginx vhost for tornado.micutu.com
# Install: /etc/nginx/sites-enabled/tornado.micutu.com (+ the two files below)
#   snippets/security-headers-tornado.conf   security headers (every location)
#   conf.d/tornado-rate-limit.conf           limit_req zone (http context)
# Shared files this vhost expects from the host:
#   snippets/block-dotfiles.conf, conf.d/cloudflare-origin-guard.conf
#   ($from_cloudflare_origin) and conf.d/cloudflare-realip.conf (real
#   visitor address in $remote_addr).
#
# Traffic: Cloudflare edge -> cloudflared (this host) -> https://127.0.0.1:443.
# The root is a symlink that deploy_vps.sh swaps atomically between releases.
#
# Cache policy
#   *.<10 hex>.(js|css|wasm|data)   1 year, immutable (content-hashed names)
#   /, *.html, sw.js, manifest       no-cache (revalidate with ETag every time)
#   icons, og image, favicon         1 week
#   /api/                            whatever the API says

server {
    include snippets/block-dotfiles.conf;
    server_name tornado.micutu.com;

    # Only Cloudflare (and the local tunnel) may reach this origin.
    set $tornado_origin_allowed $from_cloudflare_origin;
    if ($tornado_origin_allowed = 0) {
        return 403;
    }
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    root /var/www/tornado.micutu.com;
    index index.html;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm application/octet-stream
               application/xml image/svg+xml image/x-icon text/plain;

    # Content-hashed build output: never changes under the same name.
    location ~* "\.[0-9a-f]{10}\.(?:js|css|wasm|data)$" {
        types {
            text/javascript          js;
            text/css                 css;
            application/wasm         wasm;
            application/octet-stream data;
        }
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The page, the service worker and the manifest must always revalidate:
    # they decide which hashed files a visitor loads.
    location = /index.html {
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /404.html {
        internal;
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt {
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /sitemap.xml {
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* \.(?:png|jpe?g|svg|ico|webp)$ {
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Leaderboard API (server/leaderboard.py). The service enforces its own
    # per-endpoint limits; this zone only absorbs floods before Python.
    location /api/ {
        limit_except GET POST { deny all; }
        limit_req zone=tornado_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        include snippets/security-headers-tornado.conf;
    }

    # Everything else: real files or a real 404 (no SPA fallback, so
    # crawlers never see the game page under random URLs).
    location / {
        include snippets/security-headers-tornado.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Responses produced at server level (403/405 above) get the headers too.
    include snippets/security-headers-tornado.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/tornado.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tornado.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tornado_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
}

server {
    listen 80;
    listen [::]:80;
    server_name tornado.micutu.com;
    return 301 https://$host$request_uri;
}
