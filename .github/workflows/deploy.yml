name: Build, Test & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build WASM
        run: |
          emcmake cmake -B build-wasm -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j$(nproc)
          # Publish as index.html so GitHub Pages serves it at the root URL
          cp build-wasm/tornado.html build-wasm/index.html

      - name: Run tests
        run: ctest --test-dir build-wasm --output-on-failure

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build-wasm
          publish_branch: gh-pages
